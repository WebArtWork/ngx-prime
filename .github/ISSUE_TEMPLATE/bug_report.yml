name: Bug report
description: Create a report to help ngx-prime improve.
title: Issue Title
labels:
  - 'Status: Needs Triage'
body:
  - type: markdown
    attributes:
      value: |
        ## Before reporting

        Please search existing issues and provide a minimal reproducible example. ngx-prime is maintained by Web Art Work and community contributors.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Explain the actual and expected behaviour.
    validations:
      required: true
  - type: input
    id: reproducer
    attributes:
      label: Reproducer
      description: Link to a minimal reproduction repository or StackBlitz.
    validations:
      required: true
  - type: input
    id: ngx-prime-version
    attributes:
      label: ngx-prime version
      placeholder: x.x.x
    validations:
      required: true
  - type: input
    id: angular-version
    attributes:
      label: Angular version
      placeholder: x.x.x
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, OS, and Node.js version where relevant.
    validations:
      required: true
