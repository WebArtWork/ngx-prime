packages:
  - 'packages/*'
  - 'apps/*'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js
  - esbuild
  - lmdb
  - msgpackr-extract

catalog:
  '@primeuix/styled': ^0.7.4
  '@primeuix/utils': ^0.7.2
  '@primeuix/styles': ^2.0.3
  '@primeuix/themes': ^2.0.3
  '@primeuix/motion': ^0.0.10
  '@primeuix/mcp': ^1.0.0
  'tailwindcss-primeui': ^0.6.1
  'primeicons': ^7.0.0

catalogs:
  angular22:
    "@angular/build": ^22.1.4
    "@angular-devkit/build-angular": ^22.1.4
    "@angular/animations": ^22.1.2
    "@angular/cdk": ^22.1.2
    "@angular/cli": ^22.1.4
    "@angular/common": ^22.1.2
    "@angular/compiler": ^22.1.2
    "@angular/compiler-cli": ^22.1.2
    "@angular/core": ^22.1.2
    "@angular/forms": ^22.1.2
    "@angular/platform-browser": ^22.1.2
    "@angular/platform-browser-dynamic": ^22.1.2
    "@angular/platform-server": ^22.1.2
    "@angular/router": ^22.1.2
    "@angular/ssr": ^22.1.4
    "@angular-eslint/eslint-plugin": ^22.1.0
    "@angular-eslint/eslint-plugin-template": ^22.1.0
    "@angular-eslint/schematics": ^22.1.0
    "@angular-eslint/template-parser": ^22.1.0
    "ng-packagr": ^22.1.1
    "typescript": 6.0.3

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

# Transitive-only patches for known-high advisories (see `pnpm audit --prod
# --audit-level high`). None of these are direct dependencies of ours; they
# come in through @primeuix/mcp's MCP SDK chain and through postcss/
# autoprefixer in the showcase. Pinned to the lowest version that resolves
# each advisory so we stay close to what the graph would otherwise pick.
overrides:
  hono: '>=4.12.25'
  fast-uri: '>=3.1.5'
  ip-address: '>=10.3.1'
  nanoid: '>=3.3.18'
  postcss: '>=8.5.18'
